name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    # Les tests d'isolation RLS s'exécutent sur un PostgreSQL réel.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: hilaac
          POSTGRES_PASSWORD: hilaac
          POSTGRES_DB: hilaac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hilaac -d hilaac"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Valeurs locales de .env.example, alignées sur le service postgres ci-dessus.
        run: cp .env.example .env && pnpm test

      - name: Build
        run: pnpm build
